<!doctype html>

<!-- The emulator alone, for development: the panel of the installer's Try tab with the firmware of this checkout.
     web/emu/make_page.py fills it (one file, it works from disk and offline); tools/emu.sh builds and opens it.
     #selftest: switches on by itself, plays, and writes what it saw in the title (a headless browser's check). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drumtonic emulator (dev)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&display=swap">
<style>
:root { --bg: #000000; --box: #17181a; --act: #24262a; --txt: #f4f4f2; --sec: #a4a7ac; --ink: #000000; --go: #ff6b4a;
        --err: #ff2e3e; --face: "Saira Condensed", "Arial Narrow", sans-serif; color-scheme: dark; }
body { background: var(--bg); color: var(--txt); font: 500 19px/1.4 var(--face); margin: 0; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
h1 { margin: 0; font: 700 40px/1 var(--face); text-transform: uppercase; } h1 span { color: var(--sec); font-size: 20px; }
</style>
</head>
<body>
<main>
<h1>Drumtonic emulator <span>dev · @VERSION@</span></h1>
<div id="emu"></div>
</main>
<script>const EMU_WASM = "@EMU_WASM@"; const EMU_WORKLET = @EMU_WORKLET@;</script>
<script type="module">
/*@EMU_CODE@*/
const panel = mountEmu(document.getElementById("emu"), { wasm: EMU_WASM, worklet: EMU_WORKLET });
if (location.hash === "#selftest") (async () => {     // a headless browser's check: the result in the title
    const t0 = performance.now(), emu = panel.host, wait = ms => new Promise(r => setTimeout(r, ms));
    const key = (t, code) => dispatchEvent(new KeyboardEvent(t, { code }));
    document.querySelector(".emu-on").click();
    while (!emu.node && performance.now() - t0 < 5000) await wait(50);
    await wait(300);
    const an = emu.ctx.createAnalyser(); emu.gain.connect(an);
    const buf = new Float32Array(2048);
    key("keydown", "Space"); await wait(60); key("keyup", "Space");   // closes the opening
    await wait(300);
    key("keydown", "Space"); await wait(60); key("keyup", "Space");   // PLAY
    let peak = 0;
    for (let i = 0; i < 30; i++) { await wait(50); an.getFloatTimeDomainData(buf); for (const v of buf) peak = Math.max(peak, Math.abs(v)); }
    const lit = document.querySelectorAll(".emu svg .led.on, .emu svg .btng.lit").length;
    document.title = `SELFTEST ms=${emu.ms} peak=${peak.toFixed(3)} lit=${lit} rate=${emu.ctx.sampleRate} help=${document.querySelector(".emu-help b").textContent}`;
})();
</script>
</body>
</html>
